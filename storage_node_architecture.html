<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;padding:16px;background:#fff;color:#1a1a1a}
@media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#e2e2e2}}
svg text{font-family:sans-serif}
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 435" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.t{font-size:14px;fill:var(--t,#1a1a1a)}
.ts{font-size:12px;fill:var(--t,#1a1a1a);opacity:.75}
.th{font-size:14px;font-weight:500;fill:var(--t,#1a1a1a)}
.arr{stroke:var(--s,#888);stroke-width:1.5;fill:none}
.box{fill:var(--bg2,#f5f5f5);stroke:var(--b,#ccc);stroke-width:.5}
.leader{stroke:var(--t,#999);stroke-width:.5;stroke-dasharray:4 3;fill:none}
.node{cursor:pointer}.node:hover rect,.node:hover circle{opacity:.85}
.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#185FA5;stroke-width:.5}
.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}
.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){
.c-purple>rect,.c-purple>circle{fill:#3C3489;stroke:#AFA9EC}
.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal>rect,.c-teal>circle{fill:#085041;stroke:#5DCAA5}
.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-blue>rect,.c-blue>circle{fill:#0C447C;stroke:#85B7EB}
.c-blue .th{fill:#B5D4F4}.c-blue .ts{fill:#85B7EB}
.c-amber>rect,.c-amber>circle{fill:#633806;stroke:#EF9F27}
.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}
.c-gray>rect,.c-gray>circle{fill:#444441;stroke:#B4B2A9}
.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
.t,.ts,.th{fill:#e2e2e2}
.box{fill:#2a2a2a;stroke:#444}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="ts" x="50" y="15" opacity="0.4">application layer</text>

<g class="node c-purple">
  <rect x="50" y="20" width="580" height="44" rx="8"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">vLLM</text>
</g>

<line x1="340" y1="64" x2="340" y2="80" class="arr" marker-end="url(#arrow)"/>

<rect x="50" y="80" width="580" height="148" rx="12" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 3"/>
<text class="ts" x="66" y="93" opacity="0.5">nabustore  —  github.com/nabustore/nabustore</text>

<g class="node c-teal">
  <rect x="60" y="96" width="178" height="52" rx="8"/>
  <text class="th" x="149" y="113" text-anchor="middle" dominant-baseline="central">KV cache engine</text>
  <text class="ts" x="149" y="133" text-anchor="middle" dominant-baseline="central">EC 4+2 · recompute</text>
</g>
<g class="node c-teal">
  <rect x="250" y="96" width="178" height="52" rx="8"/>
  <text class="th" x="339" y="113" text-anchor="middle" dominant-baseline="central">Model weights</text>
  <text class="ts" x="339" y="133" text-anchor="middle" dominant-baseline="central">3× replication</text>
</g>
<g class="node c-teal">
  <rect x="440" y="96" width="178" height="52" rx="8"/>
  <text class="th" x="529" y="113" text-anchor="middle" dominant-baseline="central">Checkpoints</text>
  <text class="ts" x="529" y="133" text-anchor="middle" dominant-baseline="central">multi-stripe layout</text>
</g>

<g class="node c-blue">
  <rect x="60" y="160" width="131" height="52" rx="8"/>
  <text class="th" x="125" y="177" text-anchor="middle" dominant-baseline="central">CXL index</text>
  <text class="ts" x="125" y="197" text-anchor="middle" dominant-baseline="central">Robin Hood</text>
</g>
<g class="node c-blue">
  <rect x="203" y="160" width="131" height="52" rx="8"/>
  <text class="th" x="268" y="177" text-anchor="middle" dominant-baseline="central">Blob store</text>
  <text class="ts" x="268" y="197" text-anchor="middle" dominant-baseline="central">content-addr.</text>
</g>
<g class="node c-blue">
  <rect x="346" y="160" width="131" height="52" rx="8"/>
  <text class="th" x="411" y="177" text-anchor="middle" dominant-baseline="central">DHT ring</text>
  <text class="ts" x="411" y="197" text-anchor="middle" dominant-baseline="central">150 vnodes</text>
</g>
<g class="node c-blue">
  <rect x="489" y="160" width="131" height="52" rx="8"/>
  <text class="th" x="554" y="177" text-anchor="middle" dominant-baseline="central">EC engine</text>
  <text class="ts" x="554" y="197" text-anchor="middle" dominant-baseline="central">GF(2⁸) RS</text>
</g>

<text class="ts" x="50" y="243" opacity="0.4">userspace I/O</text>

<line x1="340" y1="228" x2="340" y2="248" class="arr" marker-end="url(#arrow)"/>

<!-- mmap path from CXL index down -->
<line x1="125" y1="212" x2="125" y2="320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="60" y="272" text-anchor="start" opacity="0.55">mmap</text>

<g class="node c-amber">
  <rect x="203" y="248" width="274" height="52" rx="8"/>
  <text class="th" x="340" y="265" text-anchor="middle" dominant-baseline="central">SPDK</text>
  <text class="ts" x="340" y="285" text-anchor="middle" dominant-baseline="central">NVMe-oF + RDMA verbs (libibverbs)</text>
</g>

<g class="node c-amber">
  <rect x="489" y="248" width="131" height="52" rx="8"/>
  <text class="th" x="554" y="265" text-anchor="middle" dominant-baseline="central">DPDK</text>
  <text class="ts" x="554" y="285" text-anchor="middle" dominant-baseline="central">replication only</text>
</g>

<text class="ts" x="50" y="315" opacity="0.4">hardware</text>

<path d="M340 300 L340 310 L269 310 L269 320" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 300 L340 310 L412 310 L412 320" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="554" y1="300" x2="554" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="node c-teal">
  <rect x="60" y="320" width="131" height="60" rx="8"/>
  <text class="th" x="125" y="341" text-anchor="middle" dominant-baseline="central">CXL DIMMs</text>
  <text class="ts" x="125" y="361" text-anchor="middle" dominant-baseline="central">blob index</text>
</g>
<g class="node c-gray">
  <rect x="203" y="320" width="131" height="60" rx="8"/>
  <text class="th" x="268" y="341" text-anchor="middle" dominant-baseline="central">NVMe SSDs</text>
  <text class="ts" x="268" y="361" text-anchor="middle" dominant-baseline="central">data blobs</text>
</g>
<g class="node c-purple">
  <rect x="346" y="320" width="131" height="60" rx="8"/>
  <text class="th" x="411" y="341" text-anchor="middle" dominant-baseline="central">IB NICs</text>
  <text class="ts" x="411" y="361" text-anchor="middle" dominant-baseline="central">NDR → GPU HBM</text>
</g>
<g class="node c-blue">
  <rect x="489" y="320" width="131" height="60" rx="8"/>
  <text class="th" x="554" y="341" text-anchor="middle" dominant-baseline="central">ConnectX NIC</text>
  <text class="ts" x="554" y="361" text-anchor="middle" dominant-baseline="central">200 GbE / RoCE</text>
</g>

<!-- legend -->
<circle cx="50" cy="404" r="5" fill="#1D9E75"/>
<text class="ts" x="60" y="408">Userspace I/O</text>
<circle cx="165" cy="404" r="5" fill="#534AB7"/>
<text class="ts" x="175" y="408">GPU data plane (IB)</text>
<circle cx="310" cy="404" r="5" fill="#185FA5"/>
<text class="ts" x="320" y="408">Replication plane (Ethernet)</text>
<circle cx="490" cy="404" r="5" fill="#0F6E56"/>
<text class="ts" x="500" y="408">Inference / index</text>
</svg>
</body>
</html>
